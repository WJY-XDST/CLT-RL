[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clt-wheelleg-sim2real"
version = "0.1.0"
description = "Offline-first obs-to-reference host for the imported closed-five-bar robot"
requires-python = ">=3.11"
dependencies = ["torch>=2.7", "PyYAML>=6"]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]

[project.scripts]
wheelleg-deploy = "wheelleg_deploy.__main__:main"

[tool.setuptools.packages.find]
include = ["wheelleg_deploy*"]
